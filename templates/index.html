<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortner</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-red-200 to-red-400 text-gray-800 font-sans flex items-start justify-center min-h-screen pt-20">

<div class="max-w-3xl w-full px-4">

    <h1 class="text-4xl font-bold mb-8 text-center text-blue-700">
        🔗 Python URL Shortener
    </h1>

    <!-- Form -->
    <form method="post" class="bg-white shadow-lg rounded-xl p-6 space-y-4 border">

        <label class="block">
            <span class="text-gray-700 font-medium">Enter a long URL</span>

            <input 
            type="text" 
            name="url" 
            placeholder="https://example.com/veryLongURL"
            required
            class="mt-2 block w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-400 focus:outline-none"
            >

        </label>

        <button 
        class="w-full bg-blue-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
        Shorten URL
        </button>

    </form>

    <!-- Table Title -->
    <h2 class="text-2xl font-semibold mt-10 mb-4 text-gray-700">
        All Shortened URLs
    </h2>

    {% if all_urls %}
    <div class="overflow-x-auto bg-white shadow-lg rounded-xl border">

        <table class="w-full border-collapse text-sm">

            <thead class="bg-gray-100 text-gray-700">
                <tr>
                    <th class="px-4 py-3 text-left">Short URL</th>
                    <th class="px-4 py-3 text-left">Original URL</th>
                    <th class="px-4 py-3 text-left">Visits</th>
                    <th class="px-4 py-3 text-left">Action</th>
                </tr>
            </thead>

            <tbody>
                {% for url in all_urls %}
                <tr class="border-t hover:bg-gray-50">

                    <td class="px-4 py-3 text-blue-600 underline">
                        <a href="/{{ url[1] }}" target="_blank">
                            http://localhost:5000/{{url[1]}}
                        </a>
                    </td>

                    <td class="px-4 py-3 break-all">
                        {{url[0]}}
                    </td>

                    <td class="px-4 py-3 font-medium">
                        {{url[2]}}
                    </td>

                    <td class="px-4 py-3">
                        <form action="/delete/{{url[1]}}"
                        method="POST"
                        onsubmit="return confirm('Delete this short url?')">

                        <button 
                        type="submit"
                        class="text-red-600 hover:text-red-800 font-medium">
                        Delete
                        </button>

                        </form>
                    </td>

                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

    {% else %}

    <p class="text-gray-600 italic">
        No URLs have been shortened yet.
    </p>

    {% endif %}

</div>

</body>
</html>
